default_install_hook_types = [
  "pre-commit",
  "commit-msg",
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "check-added-large-files" },
  { id = "detect-private-key", types = ["text"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "treefmt"
name = "treefmt"
language = "system"
entry = "treefmt"
pass_filenames = false

[[repos.hooks]]
id = "typos"
name = "typos"
language = "system"
entry = "typos"

[[repos.hooks]]
id = "cog-verify"
name = "cog verify"
language = "system"
entry = "cog verify --file"
stages = [
  "commit-msg",
]
